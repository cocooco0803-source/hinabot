<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 400px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
    font-family: Arial, sans-serif;
}

.board {
    width: 400px;
    height: 1080px;
    padding: 2px 10px;
    overflow: hidden;
    background: transparent;
}

.title {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 30px;
    font-weight: 900;
    color: #ff4f94;

    margin: 0;

    text-shadow:
        -2px -2px 0 white,
         2px -2px 0 white,
        -2px  2px 0 white,
         2px  2px 0 white;
}

.viewport {
    width: 100%;
    height: 1032px;
    overflow: hidden;
}

.menu-list {
    width: 100%;
    --scroll-distance: 0px;
    --scroll-time: 25s;
}

.menu-list.scrolling {
    animation: menuScroll var(--scroll-time) ease-in-out infinite;
}

@keyframes menuScroll {
    0%, 10% {
        transform: translateY(0);
    }

    45%, 60% {
        transform: translateY(calc(-1 * var(--scroll-distance)));
    }

    90%, 100% {
        transform: translateY(0);
    }
}

/* 메뉴 한 줄 */
.menu-item {
    width: 100%;
    height: 24px;
    min-height: 24px;

    display: flex;
    align-items: center;

    margin: 0;
    padding: 0;
}

/* 개수 */
.price {
    width: 100px;
    flex-shrink: 0;

    text-align: right;

    font-size: 17px;
    font-weight: 900;
    line-height: 24px;

    color: #ff3f8d;

    text-shadow:
        -1px -1px 0 white,
         1px -1px 0 white,
        -1px  1px 0 white,
         1px  1px 0 white;
}

/* 하트 */
.heart {
    width: 34px;
    flex-shrink: 0;

    text-align: center;

    font-size: 16px;
    line-height: 24px;
}

/* 메뉴명 */
.name {
    flex: 1;

    font-size: 17px;
    font-weight: 900;
    line-height: 24px;

    color: #ff69a5;

    white-space: nowrap;

    text-shadow:
        -1px -1px 0 white,
         1px -1px 0 white,
        -1px  1px 0 white,
         1px  1px 0 white;
}
</style>
</head>

<body>

<div class="board">

    <div class="title">
        ♥ HINA ♥
    </div>

    <div class="viewport" id="viewport">
        <div class="menu-list" id="menuList"></div>
    </div>

</div>


<script>

const SHEET_URL =
"https://script.google.com/macros/s/AKfycbxe99AfRasOtEEcT4pIbEo3cW6eonEiYc4PVL3mTmmhwkFyq2STTu8nYpQyX8Wcaz4/exec";

let previousData = "";


async function loadMenu() {

    try {

        const response = await fetch(
            SHEET_URL + "?t=" + Date.now(),
            { cache: "no-store" }
        );

        const data = await response.json();

        const currentData =
            JSON.stringify(data.menus);


        /* 내용이 그대로면 다시 안 그림 */
        if (currentData === previousData) {
            return;
        }

        previousData = currentData;

        renderMenu(data.menus);

    } catch (error) {

        console.error(
            "메뉴 불러오기 실패",
            error
        );

    }
}


function renderMenu(menus) {

    const menuList =
        document.getElementById("menuList");

    menuList.classList.remove("scrolling");

    menuList.innerHTML = "";


    menus.forEach(menu => {

        const item =
            document.createElement("div");

        item.className = "menu-item";

        item.innerHTML = `
            <div class="price">${menu.price}</div>
            <div class="heart">💗</div>
            <div class="name">${menu.name}</div>
        `;

        menuList.appendChild(item);

    });


    requestAnimationFrame(() => {
        requestAnimationFrame(setScroll);
    });
}


function setScroll() {

    const viewport =
        document.getElementById("viewport");

    const menuList =
        document.getElementById("menuList");


    const overflow =
        menuList.scrollHeight -
        viewport.clientHeight;


    if (overflow > 0) {

        const distance =
            overflow + 5;

        menuList.style.setProperty(
            "--scroll-distance",
            distance + "px"
        );

        const duration =
            Math.max(
                20,
                20 + distance / 20
            );

        menuList.style.setProperty(
            "--scroll-time",
            duration + "s"
        );

        void menuList.offsetWidth;

        menuList.classList.add("scrolling");
    }
}


loadMenu();

setInterval(loadMenu, 5000);

</script>

</body>
</html>
