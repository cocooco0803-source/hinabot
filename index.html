<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<style>

/* =========================
   완전 투명 배경 강제
========================= */

html,
body,
.board,
.viewport,
.scroll-track,
.menu-group,
.menu-item {
    background: transparent !important;
    background-color: rgba(0, 0, 0, 0) !important;
}


/* =========================
   기본 설정
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 400px;
    height: 1080px;

    overflow: hidden;

    background: rgba(0, 0, 0, 0) !important;

    font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;
}


/* =========================
   전체 메뉴판
========================= */

.board {
    width: 400px;
    height: 1080px;

    padding: 4px 8px;

    overflow: hidden;

    background: transparent !important;
}


/* =========================
   상단 HINA
========================= */

.title {
    width: 100%;
    height: 52px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 32px;
    font-weight: 900;

    color: #ff4f94;

    letter-spacing: 1px;

    background: transparent !important;

    text-shadow:
        -2px -2px 0 #ffffff,
         2px -2px 0 #ffffff,
        -2px  2px 0 #ffffff,
         2px  2px 0 #ffffff;
}


/* =========================
   메뉴 보이는 영역
========================= */

.viewport {
    width: 100%;
    height: 1020px;

    overflow: hidden;

    background: transparent !important;
}


/* =========================
   움직이는 메뉴
========================= */

.scroll-track {
    width: 100%;

    will-change: transform;

    background: transparent !important;
}


.scroll-track.scrolling {

    animation:
        scrollUp
        var(--scroll-time)
        linear
        infinite;
}


@keyframes scrollUp {

    from {
        transform: translateY(0);
    }

    to {
        transform:
            translateY(
                calc(-1 * var(--group-height))
            );
    }
}


/* =========================
   메뉴 그룹
========================= */

.menu-group {

    width: 100%;

    background: transparent !important;
}


/* =========================
   메뉴 한 줄
========================= */

.menu-item {

    width: 100%;

    height: 30px;
    min-height: 30px;

    display: flex;
    align-items: center;

    padding: 0 7px;

    margin: 0 0 2px 0;

    background: transparent !important;
    background-color: rgba(0,0,0,0) !important;

    border: none;
}


/* =========================
   숫자
========================= */

.price {

    width: 92px;

    flex-shrink: 0;

    text-align: right;

    font-size: 20px;
    font-weight: 900;

    line-height: 30px;

    color: #ff3285;

    background: transparent !important;

    text-shadow:
        -1px -1px 0 #ffffff,
         1px -1px 0 #ffffff,
        -1px  1px 0 #ffffff,
         1px  1px 0 #ffffff;
}


/* =========================
   하트
========================= */

.heart {

    width: 32px;

    flex-shrink: 0;

    text-align: center;

    font-size: 17px;

    line-height: 30px;

    background: transparent !important;
}


/* =========================
   시그 제목
========================= */

.name {

    flex: 1;

    min-width: 0;

    font-size: 20px;
    font-weight: 900;

    line-height: 30px;

    /*
       연보라색
    */
    color: #c9a7ff;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    background: transparent !important;

    text-shadow:
        -1px -1px 0 #ffffff,
         1px -1px 0 #ffffff,
        -1px  1px 0 #ffffff,
         1px  1px 0 #ffffff;
}

</style>
</head>


<body>

<div class="board">

    <div class="title">
        ♥ HINA ♥
    </div>


    <div
        class="viewport"
        id="viewport"
    >

        <div
            class="scroll-track"
            id="scrollTrack"
        ></div>

    </div>

</div>



<script>


/* =========================
   구글시트 주소
========================= */

const SHEET_URL =
"https://script.google.com/macros/s/AKfycbxe99AfRasOtEEcT4pIbEo3cW6eonEiYc4PVL3mTmmhwkFyq2STTu8nYpQyX8Wcaz4/exec";


/* =========================
   스크롤 속도
========================= */

const SCROLL_SPEED = 25;


/* 이전 데이터 */
let previousData = "";


/* =========================
   메뉴 한 묶음 생성
========================= */

function createGroup(menus) {

    const group =
        document.createElement("div");

    group.className =
        "menu-group";


    menus.forEach(menu => {


        const item =
            document.createElement("div");

        item.className =
            "menu-item";


        /* 숫자 */

        const price =
            document.createElement("div");

        price.className =
            "price";

        price.textContent =
            menu.price;


        /* 하트 */

        const heart =
            document.createElement("div");

        heart.className =
            "heart";

        heart.textContent =
            "💗";


        /* 시그 제목 */

        const name =
            document.createElement("div");

        name.className =
            "name";

        name.textContent =
            menu.name;


        item.appendChild(price);
        item.appendChild(heart);
        item.appendChild(name);

        group.appendChild(item);

    });


    return group;
}


/* =========================
   메뉴 출력
========================= */

function renderMenu(menus) {

    const viewport =
        document.getElementById(
            "viewport"
        );


    const track =
        document.getElementById(
            "scrollTrack"
        );


    track.classList.remove(
        "scrolling"
    );


    track.innerHTML = "";


    if (menus.length === 0) {
        return;
    }


    const firstGroup =
        createGroup(menus);


    track.appendChild(
        firstGroup
    );


    requestAnimationFrame(() => {


        const groupHeight =
            firstGroup.offsetHeight;


        if (groupHeight <= 0) {
            return;
        }


        /*
           화면 전체 채우기
        */

        const copies =
            Math.ceil(
                viewport.clientHeight /
                groupHeight
            ) + 2;


        for (
            let i = 1;
            i < copies;
            i++
        ) {

            track.appendChild(
                createGroup(menus)
            );

        }


        /*
           메뉴 한 묶음 높이
        */

        track.style.setProperty(
            "--group-height",
            groupHeight + "px"
        );


        /*
           스크롤 시간
        */

        const duration =
            groupHeight /
            SCROLL_SPEED;


        track.style.setProperty(
            "--scroll-time",
            duration + "s"
        );


        void track.offsetWidth;


        track.classList.add(
            "scrolling"
        );

    });

}


/* =========================
   구글시트 불러오기
========================= */

async function loadMenu() {

    try {


        const response =
            await fetch(

                SHEET_URL +
                "?t=" +
                Date.now(),

                {
                    cache: "no-store"
                }

            );


        const data =
            await response.json();


        const menus =
            Array.isArray(data.menus)
            ? data.menus
            : [];


        const currentData =
            JSON.stringify(menus);


        /*
           내용이 같으면
           스크롤 유지
        */

        if (
            currentData ===
            previousData
        ) {

            return;

        }


        previousData =
            currentData;


        renderMenu(menus);

    }


    catch(error) {

        console.error(
            "구글시트 불러오기 실패:",
            error
        );

    }

}


/* 처음 실행 */

loadMenu();


/* 5초마다 시트 확인 */

setInterval(
    loadMenu,
    5000
);


</script>

</body>
</html>
