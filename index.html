<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 400px;
    height: 1080px;

    overflow: hidden;

    background: transparent;

    font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;
}


/* 전체 메뉴판 */
.board {
    width: 400px;
    height: 1080px;

    padding: 4px 8px;

    overflow: hidden;

    background: transparent;
}


/* HINA */
.title {
    width: 100%;
    height: 52px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 32px;
    font-weight: 900;

    color: #ff4f94;

    letter-spacing: 1px;

    text-shadow:
        -2px -2px 0 #ffffff,
         2px -2px 0 #ffffff,
        -2px  2px 0 #ffffff,
         2px  2px 0 #ffffff,
         0px  2px 3px #ff9bc2;
}


/* 보이는 스크롤 영역 */
.viewport {
    width: 100%;
    height: 1020px;

    overflow: hidden;
}


/* 스크롤 */
.scroll-track {
    width: 100%;
    will-change: transform;
}

.scroll-track.scrolling {
    animation:
        scrollUp
        var(--scroll-time)
        linear
        infinite;
}


@keyframes scrollUp {

    from {
        transform: translateY(0);
    }

    to {
        transform:
            translateY(
                calc(-1 * var(--group-height))
            );
    }
}


.menu-group {
    width: 100%;
}


/* 메뉴 한 줄 */
.menu-item {

    width: 100%;

    height: 30px;
    min-height: 30px;

    display: flex;
    align-items: center;

    padding: 0 7px;

    margin-bottom: 2px;

    /* 배경 완전 투명 */
    background: transparent;
}


/* 숫자 */
.price {

    width: 92px;

    flex-shrink: 0;

    text-align: right;

    font-size: 20px;
    font-weight: 900;

    line-height: 30px;

    color: #ff3285;

    text-shadow:
        -1px -1px 0 #ffffff,
         1px -1px 0 #ffffff,
        -1px  1px 0 #ffffff,
         1px  1px 0 #ffffff,
         0px  2px 2px #ff8db9;
}


/* 하트 */
.heart {

    width: 32px;

    flex-shrink: 0;

    text-align: center;

    font-size: 17px;

    line-height: 30px;
}


/* 시그 제목 */
.name {

    flex: 1;

    min-width: 0;

    font-size: 20px;
    font-weight: 900;

    line-height: 30px;

    /*
       시그 제목 색상
       밝은 하늘색
    */
    color: #79e4ff;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    /*
       흰색 테두리 + 은은한 파란 그림자
    */
    text-shadow:
        -1px -1px 0 #ffffff,
         1px -1px 0 #ffffff,
        -1px  1px 0 #ffffff,
         1px  1px 0 #ffffff,
         0px  2px 2px #3fa9d5;
}

</style>
</head>


<body>

<div class="board">

    <div class="title">
        ♥ HINA ♥
    </div>


    <div
        class="viewport"
        id="viewport"
    >

        <div
            class="scroll-track"
            id="scrollTrack"
        ></div>

    </div>

</div>



<script>


const SHEET_URL =
"https://script.google.com/macros/s/AKfycbxe99AfRasOtEEcT4pIbEo3cW6eonEiYc4PVL3mTmmhwkFyq2STTu8nYpQyX8Wcaz4/exec";


/* 스크롤 속도 */
const SCROLL_SPEED = 25;


/* 이전 데이터 */
let previousData = "";


/* 메뉴 한 묶음 */
function createGroup(menus) {

    const group =
        document.createElement("div");

    group.className =
        "menu-group";


    menus.forEach(menu => {

        const item =
            document.createElement("div");

        item.className =
            "menu-item";


        const price =
            document.createElement("div");

        price.className =
            "price";

        price.textContent =
            menu.price;


        const heart =
            document.createElement("div");

        heart.className =
            "heart";

        heart.textContent =
            "💗";


        const name =
            document.createElement("div");

        name.className =
            "name";

        name.textContent =
            menu.name;


        item.appendChild(price);
        item.appendChild(heart);
        item.appendChild(name);

        group.appendChild(item);

    });


    return group;
}


/* 메뉴 출력 */
function renderMenu(menus) {

    const viewport =
        document.getElementById(
            "viewport"
        );


    const track =
        document.getElementById(
            "scrollTrack"
        );


    track.classList.remove(
        "scrolling"
    );


    track.innerHTML = "";


    if (menus.length === 0) {
        return;
    }


    const firstGroup =
        createGroup(menus);


    track.appendChild(
        firstGroup
    );


    requestAnimationFrame(() => {


        const groupHeight =
            firstGroup.offsetHeight;


        if (groupHeight <= 0) {
            return;
        }


        const copies =
            Math.ceil(
                viewport.clientHeight /
                groupHeight
            ) + 2;


        for (
            let i = 1;
            i < copies;
            i++
        ) {

            track.appendChild(
                createGroup(menus)
            );

        }


        track.style.setProperty(
            "--group-height",
            groupHeight + "px"
        );


        const duration =
            groupHeight /
            SCROLL_SPEED;


        track.style.setProperty(
            "--scroll-time",
            duration + "s"
        );


        void track.offsetWidth;


        track.classList.add(
            "scrolling"
        );

    });

}


/* 구글시트 불러오기 */
async function loadMenu() {

    try {

        const response =
            await fetch(

                SHEET_URL +
                "?t=" +
                Date.now(),

                {
                    cache: "no-store"
                }

            );


        const data =
            await response.json();


        const menus =
            Array.isArray(data.menus)
            ? data.menus
            : [];


        const currentData =
            JSON.stringify(menus);


        if (
            currentData ===
            previousData
        ) {
            return;
        }


        previousData =
            currentData;


        renderMenu(menus);

    }


    catch(error) {

        console.error(
            "구글시트 불러오기 실패:",
            error
        );

    }

}


/* 처음 실행 */
loadMenu();


/* 5초마다 시트 확인 */
setInterval(
    loadMenu,
    5000
);


</script>

</body>
</html>
