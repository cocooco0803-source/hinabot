<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<style>

/* =========================
   전체 기본 설정
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 400px;
    height: 1080px;

    overflow: hidden;

    background: transparent;

    font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;
}


/* =========================
   전체 메뉴판 영역
========================= */

.board {
    width: 400px;
    height: 1080px;

    padding: 4px 8px;

    overflow: hidden;

    background: transparent;
}


/* =========================
   상단 HINA 제목
========================= */

.title {
    width: 100%;
    height: 52px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 32px;
    font-weight: 900;

    color: #ff4f94;

    letter-spacing: 1px;

    text-shadow:
        -2px -2px 0 #ffffff,
         2px -2px 0 #ffffff,
        -2px  2px 0 #ffffff,
         2px  2px 0 #ffffff,
         0px  3px 4px rgba(0,0,0,0.85);
}


/* =========================
   스크롤 표시 영역
========================= */

.viewport {
    width: 100%;
    height: 1020px;

    overflow: hidden;
}


/* =========================
   실제 움직이는 메뉴
========================= */

.scroll-track {
    width: 100%;

    will-change: transform;
}


.scroll-track.scrolling {
    animation:
        scrollUp
        var(--scroll-time)
        linear
        infinite;
}


@keyframes scrollUp {

    from {
        transform: translateY(0);
    }

    to {
        transform:
            translateY(
                calc(-1 * var(--group-height))
            );
    }
}


/* =========================
   메뉴 한 묶음
========================= */

.menu-group {
    width: 100%;
}


/* =========================
   메뉴 한 줄
========================= */

.menu-item {

    width: 100%;

    height: 30px;
    min-height: 30px;

    display: flex;
    align-items: center;

    padding: 0 7px;

    margin-bottom: 2px;

    border-radius: 6px;

    background:
        rgba(0, 0, 0, 0.20);
}


/* =========================
   숫자 / 가격
========================= */

.price {

    width: 92px;

    flex-shrink: 0;

    text-align: right;

    font-size: 20px;
    font-weight: 900;

    line-height: 30px;

    color: #ff3285;

    text-shadow:
        -1px -1px 0 #ffffff,
         1px -1px 0 #ffffff,
        -1px  1px 0 #ffffff,
         1px  1px 0 #ffffff,
         0px  2px 3px rgba(0,0,0,0.9);
}


/* =========================
   하트
========================= */

.heart {

    width: 32px;

    flex-shrink: 0;

    text-align: center;

    font-size: 17px;

    line-height: 30px;

    filter:
        drop-shadow(
            0px 1px 1px
            rgba(0,0,0,0.7)
        );
}


/* =========================
   메뉴 제목

   흰색 글씨
   + 핑크 외곽선
   + 검정 그림자
========================= */

.name {

    flex: 1;

    min-width: 0;

    font-size: 20px;
    font-weight: 900;

    line-height: 30px;

    color: #ffffff;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    text-shadow:
        -1px -1px 0 #ff69a5,
         1px -1px 0 #ff69a5,
        -1px  1px 0 #ff69a5,
         1px  1px 0 #ff69a5,
         0px  2px 3px rgba(0,0,0,0.9);
}

</style>
</head>


<body>

<div class="board">

    <div class="title">
        ♥ HINA ♥
    </div>


    <div
        class="viewport"
        id="viewport"
    >

        <div
            class="scroll-track"
            id="scrollTrack"
        ></div>

    </div>

</div>



<script>


/* =========================
   구글시트 데이터 주소
========================= */

const SHEET_URL =
"https://script.google.com/macros/s/AKfycbxe99AfRasOtEEcT4pIbEo3cW6eonEiYc4PVL3mTmmhwkFyq2STTu8nYpQyX8Wcaz4/exec";


/* =========================
   스크롤 속도

   숫자가 클수록 빠름
========================= */

const SCROLL_SPEED = 25;


/* =========================
   이전 메뉴 데이터
========================= */

let previousData = "";


/* =========================
   메뉴 한 묶음 생성
========================= */

function createGroup(menus) {

    const group =
        document.createElement("div");

    group.className =
        "menu-group";


    menus.forEach(menu => {


        const item =
            document.createElement("div");

        item.className =
            "menu-item";


        /* 숫자 */

        const price =
            document.createElement("div");

        price.className =
            "price";

        price.textContent =
            menu.price;


        /* 하트 */

        const heart =
            document.createElement("div");

        heart.className =
            "heart";

        heart.textContent =
            "💗";


        /* 메뉴 제목 */

        const name =
            document.createElement("div");

        name.className =
            "name";

        name.textContent =
            menu.name;


        item.appendChild(price);

        item.appendChild(heart);

        item.appendChild(name);


        group.appendChild(item);

    });


    return group;
}


/* =========================
   메뉴 출력
========================= */

function renderMenu(menus) {

    const viewport =
        document.getElementById(
            "viewport"
        );


    const track =
        document.getElementById(
            "scrollTrack"
        );


    /* 기존 스크롤 중지 */

    track.classList.remove(
        "scrolling"
    );


    /* 기존 메뉴 삭제 */

    track.innerHTML = "";


    /* 메뉴 없으면 종료 */

    if (menus.length === 0) {
        return;
    }


    /* 첫 번째 메뉴 묶음 */

    const firstGroup =
        createGroup(menus);


    track.appendChild(
        firstGroup
    );


    requestAnimationFrame(() => {


        const groupHeight =
            firstGroup.offsetHeight;


        if (groupHeight <= 0) {
            return;
        }


        /*
           화면이 비지 않도록
           동일 메뉴 반복 생성
        */

        const copies =
            Math.ceil(
                viewport.clientHeight /
                groupHeight
            ) + 2;


        for (
            let i = 1;
            i < copies;
            i++
        ) {

            track.appendChild(
                createGroup(menus)
            );

        }


        /*
           메뉴 한 묶음 높이 저장
        */

        track.style.setProperty(
            "--group-height",
            groupHeight + "px"
        );


        /*
           스크롤 시간 계산
        */

        const duration =
            groupHeight /
            SCROLL_SPEED;


        track.style.setProperty(
            "--scroll-time",
            duration + "s"
        );


        /* 강제 갱신 */

        void track.offsetWidth;


        /* 스크롤 시작 */

        track.classList.add(
            "scrolling"
        );

    });

}


/* =========================
   구글시트 불러오기
========================= */

async function loadMenu() {

    try {


        const response =
            await fetch(

                SHEET_URL +
                "?t=" +
                Date.now(),

                {
                    cache: "no-store"
                }

            );


        const data =
            await response.json();


        const menus =
            Array.isArray(data.menus)
            ? data.menus
            : [];


        const currentData =
            JSON.stringify(menus);


        /*
           데이터 안 바뀌었으면
           현재 스크롤 유지
        */

        if (
            currentData ===
            previousData
        ) {

            return;

        }


        previousData =
            currentData;


        renderMenu(menus);

    }


    catch(error) {

        console.error(
            "구글시트 불러오기 실패:",
            error
        );

    }

}


/* 처음 실행 */

loadMenu();


/* 5초마다 구글시트 확인 */

setInterval(
    loadMenu,
    5000
);


</script>

</body>
</html>
