<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 400px;
    height: 1080px;

    overflow: hidden;

    background: transparent;

    font-family: Arial, sans-serif;
}


/* ========================================
   전체 메뉴판
======================================== */

.board {
    width: 400px;
    height: 1080px;

    padding: 5px 12px;

    background: transparent;

    overflow: hidden;
}


/* ========================================
   제목
======================================== */

.title {

    height: 55px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-bottom: 2px;

    font-size: 31px;
    font-weight: 900;

    color: #ff4f94;

    text-shadow:
        -2px -2px 0 #ffffff,
         2px -2px 0 #ffffff,
        -2px  2px 0 #ffffff,
         2px  2px 0 #ffffff,
         0 0 6px #ff8fbd;
}


/* ========================================
   메뉴 표시 영역
======================================== */

.viewport {

    width: 100%;

    height: 1015px;

    overflow: hidden;

    position: relative;
}


/* ========================================
   메뉴 전체
======================================== */

.menu-list {

    width: 100%;

    transform: translateY(0);

    --scroll-distance: 0px;
    --scroll-time: 25s;
}


/* 메뉴가 길 때만 작동 */
.menu-list.scrolling {

    animation:
        menuScroll var(--scroll-time)
        ease-in-out
        infinite;
}


/* 아래쪽 메뉴까지 보여준 뒤 다시 위로 */
@keyframes menuScroll {

    /* 위에서 잠깐 정지 */
    0% {
        transform: translateY(0);
    }

    10% {
        transform: translateY(0);
    }

    /* 아래쪽으로 이동 */
    45% {
        transform:
            translateY(
                calc(-1 * var(--scroll-distance))
            );
    }

    /* 맨 아래에서 잠깐 정지 */
    60% {
        transform:
            translateY(
                calc(-1 * var(--scroll-distance))
            );
    }

    /* 다시 위로 */
    90% {
        transform: translateY(0);
    }

    /* 위에서 잠깐 정지 */
    100% {
        transform: translateY(0);
    }
}


/* ========================================
   메뉴 한 줄
======================================== */

.menu-item {

    width: 100%;

    height: 34px;

    display: flex;
    align-items: center;

    margin: 0;
    padding: 0;

    background: transparent;
}


/* ========================================
   개수
======================================== */

.price {

    width: 105px;

    flex-shrink: 0;

    text-align: right;

    font-size: 19px;
    font-weight: 900;

    color: #ff3f8d;

    line-height: 34px;

    text-shadow:
        -1px -1px 0 #ffffff,
         1px -1px 0 #ffffff,
        -1px  1px 0 #ffffff,
         1px  1px 0 #ffffff,
         0 0 3px #ffffff;
}


/* ========================================
   하트
======================================== */

.heart {

    width: 38px;

    flex-shrink: 0;

    text-align: center;

    font-size: 18px;

    line-height: 34px;

    filter:
        drop-shadow(1px 1px 1px #ffffff)
        drop-shadow(-1px -1px 1px #ffffff);
}


/* ========================================
   메뉴 이름
======================================== */

.name {

    flex: 1;

    padding-left: 2px;

    font-size: 19px;
    font-weight: 900;

    line-height: 34px;

    color: #ff69a5;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    text-shadow:
        -1px -1px 0 #ffffff,
         1px -1px 0 #ffffff,
        -1px  1px 0 #ffffff,
         1px  1px 0 #ffffff,
         0 0 3px #ffffff;
}

</style>
</head>


<body>

<div class="board">

    <div class="title">
        ♥ HINA ♥
    </div>


    <div class="viewport" id="viewport">

        <div
            class="menu-list"
            id="menuList">
        </div>

    </div>

</div>


<script>


/* =========================================
   구글 Apps Script 주소
========================================= */

const SHEET_URL =
"https://script.google.com/macros/s/AKfycbxe99AfRasOtEEcT4pIbEo3cW6eonEiYc4PVL3mTmmhwkFyq2STTu8nYpQyX8Wcaz4/exec";


/* 이전 메뉴 내용을 기억
   → 내용이 안 바뀌었으면 화면을 다시 안 그림
*/
let previousData = "";


/* =========================================
   구글시트 불러오기
========================================= */

async function loadMenu() {

    try {

        const response = await fetch(
            SHEET_URL + "?t=" + Date.now(),
            {
                cache: "no-store"
            }
        );


        const data = await response.json();


        /*
        데이터 내용을 문자열로 만들어
        이전 데이터와 비교
        */

        const currentData =
            JSON.stringify(data.menus);


        /*
        내용이 똑같으면
        아무것도 하지 않음

        → 스크롤이 리셋되지 않음
        */

        if (currentData === previousData) {
            return;
        }


        previousData = currentData;


        renderMenu(data.menus);

    }

    catch (error) {

        console.error(
            "메뉴 불러오기 실패:",
            error
        );

    }

}


/* =========================================
   메뉴 화면에 출력
========================================= */

function renderMenu(menus) {

    const menuList =
        document.getElementById("menuList");


    menuList.classList.remove("scrolling");

    menuList.innerHTML = "";


    menus.forEach(menu => {

        const item =
            document.createElement("div");


        item.className = "menu-item";


        item.innerHTML = `

            <div class="price">
                ${menu.price}
            </div>

            <div class="heart">
                💗
            </div>

            <div class="name">
                ${menu.name}
            </div>

        `;


        menuList.appendChild(item);

    });


    /*
    브라우저가 메뉴 크기를 계산한 뒤
    스크롤 설정
    */

    requestAnimationFrame(() => {

        requestAnimationFrame(() => {

            setScroll();

        });

    });

}


/* =========================================
   자동 스크롤 계산
========================================= */

function setScroll() {

    const viewport =
        document.getElementById("viewport");

    const menuList =
        document.getElementById("menuList");


    menuList.classList.remove("scrolling");


    /*
    메뉴 전체 높이에서
    화면 높이를 뺌
    */

    const overflow =
        menuList.scrollHeight -
        viewport.clientHeight;


    /*
    화면 아래로 메뉴가 넘어갈 때만
    자동 스크롤 실행
    */

    if (overflow > 0) {


        /*
        마지막 메뉴가 너무 딱 붙지 않게
        약간 더 이동
        */

        const distance =
            overflow + 5;


        menuList.style.setProperty(
            "--scroll-distance",
            distance + "px"
        );


        /*
        메뉴가 길수록
        애니메이션 시간을 자동으로 늘림
        */

        const duration =
            Math.max(
                18,
                18 + distance / 25
            );


        menuList.style.setProperty(
            "--scroll-time",
            duration + "s"
        );


        /*
        애니메이션 강제 재시작
        */

        void menuList.offsetWidth;


        menuList.classList.add(
            "scrolling"
        );

    }

}


/* =========================================
   최초 실행
========================================= */

loadMenu();


/* =========================================
   5초마다 구글시트 변경 확인

   ★ 내용이 안 바뀌면
     스크롤은 그대로 유지됨
========================================= */

setInterval(
    loadMenu,
    5000
);


</script>

</body>

</html>
