<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 400px;
    height: 1080px;

    overflow: hidden;
    background: transparent;

    font-family: Arial, sans-serif;
}


/* ===============================
   전체 메뉴판
=============================== */

.board {
    width: 400px;
    height: 1080px;

    padding: 2px 10px;

    overflow: hidden;
    background: transparent;
}


/* ===============================
   제목
=============================== */

.title {
    height: 44px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin: 0;

    font-size: 30px;
    font-weight: 900;

    color: #ff4f94;

    text-shadow:
        -2px -2px 0 #ffffff,
         2px -2px 0 #ffffff,
        -2px  2px 0 #ffffff,
         2px  2px 0 #ffffff,
         0 0 5px #ff8fbd;
}


/* ===============================
   메뉴 표시 영역
=============================== */

.viewport {
    width: 100%;
    height: 1032px;

    overflow: hidden;
    position: relative;
}


/* ===============================
   메뉴 전체
=============================== */

.menu-list {
    width: 100%;

    will-change: transform;

    transform: translateY(0);
}


/* ===============================
   메뉴 한 줄
=============================== */

.menu-item {
    width: 100%;

    height: 24px;
    min-height: 24px;

    margin: 0;
    padding: 0;

    display: flex;
    align-items: center;

    background: transparent;
}


/* ===============================
   개수
=============================== */

.price {
    width: 100px;

    flex-shrink: 0;

    text-align: right;

    font-size: 17px;
    font-weight: 900;

    line-height: 24px;

    color: #ff3f8d;

    text-shadow:
        -1px -1px 0 #ffffff,
         1px -1px 0 #ffffff,
        -1px  1px 0 #ffffff,
         1px  1px 0 #ffffff;
}


/* ===============================
   하트
=============================== */

.heart {
    width: 34px;

    flex-shrink: 0;

    text-align: center;

    font-size: 16px;

    line-height: 24px;
}


/* ===============================
   메뉴명
=============================== */

.name {
    flex: 1;

    padding-left: 1px;

    font-size: 17px;
    font-weight: 900;

    line-height: 24px;

    color: #ff69a5;

    white-space: nowrap;

    overflow: hidden;
    text-overflow: ellipsis;

    text-shadow:
        -1px -1px 0 #ffffff,
         1px -1px 0 #ffffff,
        -1px  1px 0 #ffffff,
         1px  1px 0 #ffffff;
}

</style>
</head>


<body>

<div class="board">

    <div class="title">
        ♥ HINA ♥
    </div>


    <div
        class="viewport"
        id="viewport">

        <div
            class="menu-list"
            id="menuList">
        </div>

    </div>

</div>


<script>


/* =========================================
   구글시트 주소
========================================= */

const SHEET_URL =
"https://script.google.com/macros/s/AKfycbxe99AfRasOtEEcT4pIbEo3cW6eonEiYc4PVL3mTmmhwkFyq2STTu8nYpQyX8Wcaz4/exec";


/* =========================================
   스크롤 속도

   ★ 25px / 초 고정
========================================= */

const SCROLL_SPEED = 25;


/* 이전 구글시트 데이터 */
let previousData = "";


/* 현재 이동 위치 */
let scrollOffset = 0;


/* 이전 프레임 시간 */
let lastFrameTime = null;


/* 애니메이션 ID */
let animationId = null;


/* =========================================
   메뉴 한 줄 생성
========================================= */

function createMenuItem(menu) {

    const item =
        document.createElement("div");


    item.className =
        "menu-item";


    item.innerHTML = `
        <div class="price">${menu.price}</div>
        <div class="heart">💗</div>
        <div class="name">${menu.name}</div>
    `;


    return item;
}


/* =========================================
   메뉴 출력
========================================= */

function renderMenu(menus) {

    const menuList =
        document.getElementById("menuList");


    /* 기존 애니메이션 중지 */
    if (animationId !== null) {

        cancelAnimationFrame(
            animationId
        );

        animationId = null;
    }


    menuList.innerHTML = "";

    scrollOffset = 0;

    lastFrameTime = null;

    menuList.style.transform =
        "translateY(0px)";


    /* 메뉴 생성 */
    menus.forEach(menu => {

        menuList.appendChild(
            createMenuItem(menu)
        );

    });


    requestAnimationFrame(() => {

        startScrolling();

    });
}


/* =========================================
   스크롤 시작
========================================= */

function startScrolling() {

    const viewport =
        document.getElementById("viewport");

    const menuList =
        document.getElementById("menuList");


    /*
       메뉴 전체가 화면 안에 들어오면
       움직일 필요 없음
    */
    if (
        menuList.scrollHeight <=
        viewport.clientHeight
    ) {

        return;
    }


    lastFrameTime = null;


    animationId =
        requestAnimationFrame(
            scrollStep
        );
}


/* =========================================
   계속 위로만 움직임
========================================= */

function scrollStep(timestamp) {

    const menuList =
        document.getElementById("menuList");


    if (lastFrameTime === null) {

        lastFrameTime = timestamp;

    }


    const elapsed =
        (timestamp - lastFrameTime) /
        1000;


    lastFrameTime = timestamp;


    /*
       25px / 초 속도로
       계속 위로 이동
    */
    scrollOffset +=
        SCROLL_SPEED * elapsed;


    /*
       첫 번째 메뉴 한 줄의 높이
    */
    const firstItem =
        menuList.firstElementChild;


    if (!firstItem) {
        return;
    }


    const itemHeight =
        firstItem.offsetHeight;


    /*
       첫 번째 메뉴가 완전히
       화면 위로 사라지면

       그 메뉴를 맨 아래로 옮김.

       ★ 되감기 없음
       ★ 아래로 내려오는 동작 없음
    */
    while (
        scrollOffset >= itemHeight
    ) {

        scrollOffset -= itemHeight;


        menuList.appendChild(
            menuList.firstElementChild
        );

    }


    /*
       항상 음수 방향만 사용
       = 위쪽으로만 움직임
    */
    menuList.style.transform =
        `translateY(-${scrollOffset}px)`;


    animationId =
        requestAnimationFrame(
            scrollStep
        );
}


/* =========================================
   구글시트 불러오기
========================================= */

async function loadMenu() {

    try {

        const response =
            await fetch(

                SHEET_URL +
                "?t=" +
                Date.now(),

                {
                    cache: "no-store"
                }

            );


        const data =
            await response.json();


        const menus =
            Array.isArray(data.menus)
            ? data.menus
            : [];


        const currentData =
            JSON.stringify(menus);


        /*
           구글시트 내용이
           바뀌지 않았으면

           메뉴를 다시 만들지 않음
           → 스크롤 계속 유지
        */
        if (
            currentData ===
            previousData
        ) {

            return;
        }


        previousData =
            currentData;


        renderMenu(menus);

    }


    catch(error) {

        console.error(
            "메뉴 불러오기 실패:",
            error
        );

    }
}


/* 처음 실행 */
loadMenu();


/* 5초마다 구글시트 변경 확인 */
setInterval(
    loadMenu,
    5000
);


</script>

</body>
</html>
