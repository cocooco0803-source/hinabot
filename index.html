<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 400px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
    font-family: Arial, sans-serif;
}

/* 전체 */
.board {
    width: 400px;
    height: 1080px;
    padding: 2px 10px;
    overflow: hidden;
    background: transparent;
}

/* 제목 */
.title {
    height: 44px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 30px;
    font-weight: 900;

    color: #ff4f94;

    text-shadow:
        -2px -2px 0 white,
         2px -2px 0 white,
        -2px  2px 0 white,
         2px  2px 0 white;
}

/* 메뉴 표시창 */
.viewport {
    width: 100%;
    height: 1032px;

    overflow: hidden;
    position: relative;
}

/* 움직이는 메뉴 */
.menu-list {
    width: 100%;

    transform: translateY(0);

    will-change: transform;
}

/* 한 줄 */
.menu-item {
    width: 100%;

    height: 24px;
    min-height: 24px;

    display: flex;
    align-items: center;

    margin: 0;
    padding: 0;
}

/* 개수 */
.price {
    width: 100px;
    flex-shrink: 0;

    text-align: right;

    font-size: 17px;
    font-weight: 900;
    line-height: 24px;

    color: #ff3f8d;

    text-shadow:
        -1px -1px 0 white,
         1px -1px 0 white,
        -1px  1px 0 white,
         1px  1px 0 white;
}

/* 하트 */
.heart {
    width: 34px;
    flex-shrink: 0;

    text-align: center;

    font-size: 16px;
    line-height: 24px;
}

/* 메뉴명 */
.name {
    flex: 1;

    padding-left: 1px;

    font-size: 17px;
    font-weight: 900;
    line-height: 24px;

    color: #ff69a5;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    text-shadow:
        -1px -1px 0 white,
         1px -1px 0 white,
        -1px  1px 0 white,
         1px  1px 0 white;
}
</style>
</head>

<body>

<div class="board">

    <div class="title">
        ♥ HINA ♥
    </div>

    <div class="viewport" id="viewport">
        <div class="menu-list" id="menuList"></div>
    </div>

</div>


<script>

/* 구글시트 */
const SHEET_URL =
"https://script.google.com/macros/s/AKfycbxe99AfRasOtEEcT4pIbEo3cW6eonEiYc4PVL3mTmmhwkFyq2STTu8nYpQyX8Wcaz4/exec";


/* ★ 스크롤 속도 25px/초 */
const SCROLL_SPEED = 25;


/* 이전 구글시트 데이터 */
let previousData = "";


/* 현재 스크롤 위치 */
let scrollOffset = 0;


/* 애니메이션 관련 */
let animationId = null;
let lastFrameTime = null;


/* ===============================
   메뉴 한 줄 만들기
=============================== */

function createMenuItem(menu) {

    const item =
        document.createElement("div");

    item.className =
        "menu-item";


    const price =
        document.createElement("div");

    price.className =
        "price";

    price.textContent =
        menu.price;


    const heart =
        document.createElement("div");

    heart.className =
        "heart";

    heart.textContent =
        "💗";


    const name =
        document.createElement("div");

    name.className =
        "name";

    name.textContent =
        menu.name;


    item.appendChild(price);
    item.appendChild(heart);
    item.appendChild(name);


    return item;
}


/* ===============================
   메뉴 다시 만들기
=============================== */

function renderMenu(menus) {

    const viewport =
        document.getElementById("viewport");

    const menuList =
        document.getElementById("menuList");


    /* 기존 애니메이션 중지 */
    if (animationId !== null) {

        cancelAnimationFrame(animationId);

        animationId = null;
    }


    menuList.innerHTML = "";

    scrollOffset = 0;

    lastFrameTime = null;

    menuList.style.transform =
        "translateY(0px)";


    /*
       메뉴가 하나라도 있으면
       화면보다 길어질 때까지 반복해서 채움.

       따라서 메뉴가 2개뿐이어도
       계속 무한 스크롤 가능.
    */
    if (menus.length > 0) {

        let safety = 0;

        while (
            menuList.scrollHeight <
            viewport.clientHeight + 100
        ) {

            menus.forEach(menu => {

                menuList.appendChild(
                    createMenuItem(menu)
                );

            });


            safety++;


            /* 혹시 모를 무한루프 방지 */
            if (safety > 100) {
                break;
            }
        }


        /*
           메뉴가 이미 아주 많은 경우에도
           한 묶음 더 추가해서
           끝부분 연결을 자연스럽게 함.
        */
        menus.forEach(menu => {

            menuList.appendChild(
                createMenuItem(menu)
            );

        });


        startScrolling();
    }
}


/* ===============================
   스크롤 시작
=============================== */

function startScrolling() {

    lastFrameTime = null;

    animationId =
        requestAnimationFrame(
            scrollStep
        );
}


/* ===============================
   위로만 계속 이동
=============================== */

function scrollStep(timestamp) {

    const menuList =
        document.getElementById("menuList");


    if (lastFrameTime === null) {

        lastFrameTime =
            timestamp;
    }


    const elapsed =
        (timestamp - lastFrameTime) /
        1000;


    lastFrameTime =
        timestamp;


    /* 항상 위쪽으로 진행 */
    scrollOffset +=
        SCROLL_SPEED * elapsed;


    const firstItem =
        menuList.firstElementChild;


    if (!firstItem) {

        animationId = null;

        return;
    }


    const itemHeight =
        firstItem.offsetHeight;


    /*
       첫 줄이 위로 완전히 사라지면
       그 줄을 맨 아래로 이동
    */
    while (
        scrollOffset >= itemHeight
    ) {

        scrollOffset -=
            itemHeight;


        menuList.appendChild(
            menuList.firstElementChild
        );
    }


    menuList.style.transform =
        `translateY(-${scrollOffset}px)`;


    animationId =
        requestAnimationFrame(
            scrollStep
        );
}


/* ===============================
   구글시트 확인
=============================== */

async function loadMenu() {

    try {

        const response =
            await fetch(
                SHEET_URL +
                "?t=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );


        const data =
            await response.json();


        const menus =
            Array.isArray(data.menus)
            ? data.menus
            : [];


        const currentData =
            JSON.stringify(menus);


        /*
           시트 내용이 안 바뀌면
           아무것도 안 건드림

           → 스크롤 그대로 계속
        */
        if (
            currentData ===
            previousData
        ) {
            return;
        }


        /*
           시트 내용이 바뀐 경우
        */
        previousData =
            currentData;


        /*
           새 메뉴로 다시 만든 다음
           자동으로 스크롤 재시작
        */
        renderMenu(menus);

    }

    catch(error) {

        console.error(
            "구글시트 불러오기 실패:",
            error
        );
    }
}


/* 최초 실행 */
loadMenu();


/* 5초마다 구글시트 확인 */
setInterval(
    loadMenu,
    5000
);

</script>

</body>
</html>
