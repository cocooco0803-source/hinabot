<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 400px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
    font-family: Arial, sans-serif;
}


/* 전체 메뉴판 */
.board {
    width: 400px;
    height: 1080px;
    padding: 2px 10px;
    overflow: hidden;
    background: transparent;
}


/* 제목 */
.title {
    height: 44px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin: 0;

    font-size: 30px;
    font-weight: 900;

    color: #ff4f94;

    text-shadow:
        -2px -2px 0 #ffffff,
         2px -2px 0 #ffffff,
        -2px  2px 0 #ffffff,
         2px  2px 0 #ffffff,
         0 0 5px #ff8fbd;
}


/* 메뉴 표시 영역 */
.viewport {
    width: 100%;
    height: 1032px;
    overflow: hidden;
    position: relative;
}


/* 실제 움직이는 영역 */
.scroll-track {
    width: 100%;
    transform: translateY(0);
}


/* 무한 스크롤 */
.scroll-track.scrolling {
    animation:
        infiniteScroll
        var(--scroll-time)
        linear
        infinite;
}


/* 위로만 계속 이동 */
@keyframes infiniteScroll {

    from {
        transform: translateY(0);
    }

    to {
        transform:
            translateY(
                calc(-1 * var(--scroll-height))
            );
    }
}


/* 메뉴 묶음 */
.menu-group {
    width: 100%;
}


/* 메뉴 한 줄 */
.menu-item {
    width: 100%;

    height: 24px;
    min-height: 24px;

    display: flex;
    align-items: center;

    margin: 0;
    padding: 0;

    background: transparent;
}


/* 개수 */
.price {
    width: 100px;

    flex-shrink: 0;

    text-align: right;

    font-size: 17px;
    font-weight: 900;

    line-height: 24px;

    color: #ff3f8d;

    text-shadow:
        -1px -1px 0 #ffffff,
         1px -1px 0 #ffffff,
        -1px  1px 0 #ffffff,
         1px  1px 0 #ffffff;
}


/* 하트 */
.heart {
    width: 34px;

    flex-shrink: 0;

    text-align: center;

    font-size: 16px;

    line-height: 24px;
}


/* 메뉴 이름 */
.name {
    flex: 1;

    padding-left: 1px;

    font-size: 17px;
    font-weight: 900;

    line-height: 24px;

    color: #ff69a5;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    text-shadow:
        -1px -1px 0 #ffffff,
         1px -1px 0 #ffffff,
        -1px  1px 0 #ffffff,
         1px  1px 0 #ffffff;
}
</style>
</head>


<body>

<div class="board">

    <div class="title">
        ♥ HINA ♥
    </div>

    <div class="viewport" id="viewport">

        <div
            class="scroll-track"
            id="scrollTrack">
        </div>

    </div>

</div>


<script>

/* 구글시트 Apps Script 주소 */
const SHEET_URL =
"https://script.google.com/macros/s/AKfycbxe99AfRasOtEEcT4pIbEo3cW6eonEiYc4PVL3mTmmhwkFyq2STTu8nYpQyX8Wcaz4/exec";


/* 이전 데이터 저장 */
let previousData = "";


/* 구글시트 불러오기 */
async function loadMenu() {

    try {

        const response = await fetch(
            SHEET_URL + "?t=" + Date.now(),
            {
                cache: "no-store"
            }
        );

        const data =
            await response.json();

        const menus =
            Array.isArray(data.menus)
            ? data.menus
            : [];

        const currentData =
            JSON.stringify(menus);


        /* 내용이 안 바뀌었으면
           스크롤 유지 */
        if (currentData === previousData) {
            return;
        }


        previousData =
            currentData;

        renderMenu(menus);

    }

    catch (error) {

        console.error(
            "메뉴 불러오기 실패:",
            error
        );

    }
}


/* 메뉴 한 줄 만들기 */
function createMenuItem(menu) {

    const item =
        document.createElement("div");

    item.className =
        "menu-item";

    item.innerHTML = `
        <div class="price">${menu.price}</div>
        <div class="heart">💗</div>
        <div class="name">${menu.name}</div>
    `;

    return item;
}


/* 메뉴 출력 */
function renderMenu(menus) {

    const track =
        document.getElementById(
            "scrollTrack"
        );

    track.classList.remove(
        "scrolling"
    );

    track.innerHTML = "";


    /* 첫 번째 메뉴 묶음 */
    const firstGroup =
        document.createElement("div");

    firstGroup.className =
        "menu-group";


    menus.forEach(menu => {

        firstGroup.appendChild(
            createMenuItem(menu)
        );

    });


    track.appendChild(
        firstGroup
    );


    requestAnimationFrame(() => {

        requestAnimationFrame(() => {

            setupScroll(
                track,
                firstGroup
            );

        });

    });
}


/* 무한 스크롤 설정 */
function setupScroll(
    track,
    firstGroup
) {

    const viewport =
        document.getElementById(
            "viewport"
        );


    const groupHeight =
        firstGroup.scrollHeight;

    const viewportHeight =
        viewport.clientHeight;


    /*
       메뉴가 화면보다 짧으면
       스크롤 안 함
    */
    if (groupHeight <= viewportHeight) {
        return;
    }


    /*
       같은 메뉴를 하나 더 복제해서
       끝 다음에 처음 메뉴가 이어짐
    */
    const secondGroup =
        firstGroup.cloneNode(true);

    track.appendChild(
        secondGroup
    );


    /* 첫 메뉴 묶음 높이만큼 이동 */
    track.style.setProperty(
        "--scroll-height",
        groupHeight + "px"
    );


    /*
       스크롤 속도
       ★ 25로 고정
    */
    const pixelsPerSecond = 25;


    const duration =
        groupHeight /
        pixelsPerSecond;


    track.style.setProperty(
        "--scroll-time",
        duration + "s"
    );


    /* 애니메이션 시작 */
    void track.offsetWidth;

    track.classList.add(
        "scrolling"
    );
}


/* 처음 실행 */
loadMenu();


/* 5초마다 구글시트 변경 확인 */
setInterval(
    loadMenu,
    5000
);

</script>

</body>
</html>
