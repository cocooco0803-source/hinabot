<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 400px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
    font-family: Arial, sans-serif;
}

.board {
    width: 400px;
    height: 1080px;
    padding: 2px 10px;
    overflow: hidden;
    background: transparent;
}

.title {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 30px;
    font-weight: 900;
    color: #ff4f94;

    text-shadow:
        -2px -2px 0 white,
         2px -2px 0 white,
        -2px  2px 0 white,
         2px  2px 0 white;
}

.viewport {
    width: 100%;
    height: 1032px;
    overflow: hidden;
}

.scroll-track {
    width: 100%;
    will-change: transform;
}

.scroll-track.scrolling {
    animation:
        scrollUp
        var(--scroll-time)
        linear
        infinite;
}

@keyframes scrollUp {
    from {
        transform: translateY(0);
    }

    to {
        transform:
            translateY(
                calc(-1 * var(--group-height))
            );
    }
}

.menu-group {
    width: 100%;
}

.menu-item {
    width: 100%;
    height: 24px;
    min-height: 24px;

    display: flex;
    align-items: center;

    margin: 0;
    padding: 0;
}

.price {
    width: 100px;
    flex-shrink: 0;

    text-align: right;

    font-size: 17px;
    font-weight: 900;
    line-height: 24px;

    color: #ff3f8d;

    text-shadow:
        -1px -1px 0 white,
         1px -1px 0 white,
        -1px  1px 0 white,
         1px  1px 0 white;
}

.heart {
    width: 34px;
    flex-shrink: 0;

    text-align: center;

    font-size: 16px;
    line-height: 24px;
}

.name {
    flex: 1;

    font-size: 17px;
    font-weight: 900;
    line-height: 24px;

    color: #ff69a5;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    text-shadow:
        -1px -1px 0 white,
         1px -1px 0 white,
        -1px  1px 0 white,
         1px  1px 0 white;
}
</style>
</head>

<body>

<div class="board">

    <div class="title">
        ♥ HINA ♥
    </div>

    <div class="viewport" id="viewport">
        <div class="scroll-track" id="scrollTrack"></div>
    </div>

</div>

<script>

const SHEET_URL =
"https://script.google.com/macros/s/AKfycbxe99AfRasOtEEcT4pIbEo3cW6eonEiYc4PVL3mTmmhwkFyq2STTu8nYpQyX8Wcaz4/exec";


/* ★ 속도 25px / 초 */
const SCROLL_SPEED = 25;


/* 이전 데이터 */
let previousData = "";


/* 메뉴 한 묶음 생성 */
function createGroup(menus) {

    const group =
        document.createElement("div");

    group.className = "menu-group";


    menus.forEach(menu => {

        const item =
            document.createElement("div");

        item.className = "menu-item";


        const price =
            document.createElement("div");

        price.className = "price";
        price.textContent = menu.price;


        const heart =
            document.createElement("div");

        heart.className = "heart";
        heart.textContent = "💗";


        const name =
            document.createElement("div");

        name.className = "name";
        name.textContent = menu.name;


        item.appendChild(price);
        item.appendChild(heart);
        item.appendChild(name);

        group.appendChild(item);

    });


    return group;
}


/* 메뉴 출력 */
function renderMenu(menus) {

    const viewport =
        document.getElementById("viewport");

    const track =
        document.getElementById("scrollTrack");


    track.classList.remove("scrolling");

    track.innerHTML = "";


    if (menus.length === 0) {
        return;
    }


    /*
       첫 번째 메뉴 묶음
    */

    const firstGroup =
        createGroup(menus);

    track.appendChild(firstGroup);


    requestAnimationFrame(() => {

        const groupHeight =
            firstGroup.offsetHeight;


        if (groupHeight <= 0) {
            return;
        }


        /*
           메뉴가 적어도 화면 전체가
           반복 메뉴로 채워지도록 복제
        */

        const copies =
            Math.ceil(
                viewport.clientHeight /
                groupHeight
            ) + 2;


        for (
            let i = 1;
            i < copies;
            i++
        ) {

            track.appendChild(
                createGroup(menus)
            );

        }


        /*
           정확히 메뉴 한 묶음만큼
           위로 이동하면
           다음 동일한 묶음이 이어짐
        */

        track.style.setProperty(
            "--group-height",
            groupHeight + "px"
        );


        /*
           25px / 초
        */

        const duration =
            groupHeight /
            SCROLL_SPEED;


        track.style.setProperty(
            "--scroll-time",
            duration + "s"
        );


        void track.offsetWidth;


        track.classList.add(
            "scrolling"
        );

    });
}


/* 구글시트 불러오기 */
async function loadMenu() {

    try {

        const response =
            await fetch(
                SHEET_URL +
                "?t=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );


        const data =
            await response.json();


        const menus =
            Array.isArray(data.menus)
            ? data.menus
            : [];


        const currentData =
            JSON.stringify(menus);


        /*
           내용이 똑같으면
           현재 스크롤 그대로 유지
        */

        if (
            currentData ===
            previousData
        ) {
            return;
        }


        previousData =
            currentData;


        /*
           구글시트가 바뀌었으면
           새 메뉴로 다시 만들고
           바로 스크롤 재시작
        */

        renderMenu(menus);

    }

    catch(error) {

        console.error(
            "구글시트 불러오기 실패:",
            error
        );

    }
}


/* 처음 실행 */
loadMenu();


/* 5초마다 구글시트 확인 */
setInterval(
    loadMenu,
    5000
);

</script>

</body>
</html>
